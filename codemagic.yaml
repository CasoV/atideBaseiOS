workflows:
  ios-app-store-build:
    name: iOS App Store Build
    # 使用苹果 M2 芯片的电脑打包，速度极快
    instance_type: mac_mini_m2 
    environment:
      # 苹果要求 2026年4月28日起必须使用 Xcode 26 + iOS 26 SDK
      xcode: 26.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atide.constructionappBase
    
    # 【重要】自动签名，需要你在 Codemagic 后台绑定苹果 API Key
    integrations:
      app_store_connect: Codemagic
        
    scripts:
      - name: 安装 CocoaPods 依赖
        script: |
          pod install
          # 修复 YYKit 对旧版 WebP.framework 的依赖，iOS 26 SDK 不兼容
          for f in Pods/Target\ Support\ Files/YYKit/YYKit.*.xcconfig; do
            sed -i '' 's/ -framework "WebP"//g' "$f"
            sed -i '' 's|"${PODS_ROOT}/YYKit/Vendor"||g' "$f"
          done
          # 为主 target 添加 -ld_classic 兼容旧版静态库 libbexbankcard.a
          ruby -e "
            file = 'PMPlatform_IOS.xcodeproj/project.pbxproj'
            content = File.read(file)
            content.gsub!(/OTHER_LDFLAGS = \(/) { 'OTHER_LDFLAGS = (\"-ld_classic\",' }
            content.gsub!(/OTHER_LDFLAGS = \"\"/) { 'OTHER_LDFLAGS = \"-ld_classic\"' }
            File.write(file, content)
          "
          echo "已添加 -ld_classic 到主 target"

      - name: 递增 Build Number
        script: |
          agvtool new-version -all $((BUILD_NUMBER + 1))
          echo "Build Number set to: $((BUILD_NUMBER + 1))"
          
      - name: 设置苹果自动签名
        script: |
          xcode-project use-profiles
          
      - name: 编译并打包生成 IPA
        script: |
          xcode-project build-ipa \
            --workspace "PMPlatform_IOS.xcworkspace" \
            --scheme "PMPlatform_IOS"

      - name: 修复 ITMS-91061 - 注入 PrivacyInfo.xcprivacy
        script: |
          # 找到生成的 IPA 文件
          IPA_PATH=$(find build/ios/ipa -name "*.ipa" | head -1)
          if [ -z "$IPA_PATH" ]; then
            echo "❌ 未找到 IPA 文件"
            exit 1
          fi
          echo "IPA 路径: $IPA_PATH"

          # 解压 IPA
          WORK_DIR=$(mktemp -d)
          cp "$IPA_PATH" "$WORK_DIR/app.ipa"
          cd "$WORK_DIR"
          unzip -q app.ipa

          # 找到 .app/Frameworks 目录
          FW_DIR=$(find . -name "Frameworks" -path "*/Payload/*.app/Frameworks" | head -1)
          if [ -z "$FW_DIR" ]; then
            echo "❌ 未找到 Frameworks 目录"
            exit 1
          fi
          echo "Frameworks 目录: $FW_DIR"

          # 注入 PrivacyInfo.xcprivacy 到各 framework
          INJECTED=0
          for sdk in AFNetworking Alamofire Charts IQKeyboardManager Kingfisher SDWebImage SVProgressHUD SwiftyJSON; do
            FW="$FW_DIR/${sdk}.framework"
            if [ -d "$FW" ]; then
              if [ ! -f "$FW/PrivacyInfo.xcprivacy" ]; then
                cp "$OLDPWD/PrivacyManifests/${sdk}.xcprivacy" "$FW/PrivacyInfo.xcprivacy"
                echo "✅ 注入: ${sdk}.framework/PrivacyInfo.xcprivacy"
                INJECTED=$((INJECTED + 1))
              else
                echo "ℹ️  已存在: ${sdk}.framework/PrivacyInfo.xcprivacy"
              fi
            else
              echo "⚠️  未找到: ${sdk}.framework"
            fi
          done

          # 重新打包 IPA
          if [ $INJECTED -gt 0 ]; then
            rm -f "$OLDPWD/$IPA_PATH"
            zip -qr "$OLDPWD/$IPA_PATH" Payload/
            echo "✅ IPA 重新打包完成，共注入 $INJECTED 个 framework"
          else
            echo "ℹ️  所有 framework 已有 PrivacyInfo.xcprivacy，无需重新打包"
          fi

          cd "$OLDPWD"
          rm -rf "$WORK_DIR"

    artifacts:
      # 告诉 Codemagic 把生成的 ipa 安装包保存下来
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # 自动上传到苹果 App Store Connect 后台
      app_store_connect:
        auth: integration
        submit_to_testflight: false
