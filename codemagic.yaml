workflows:
  ios-app-store-build:
    name: iOS App Store Build
    # 使用苹果 M2 芯片的电脑打包，速度极快
    instance_type: mac_mini_m2 
    environment:
      # 苹果要求 2026年4月28日起必须使用 Xcode 26 + iOS 26 SDK
      xcode: 26.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atide.constructionappBase
    
    # 【重要】自动签名，需要你在 Codemagic 后台绑定苹果 API Key
    integrations:
      app_store_connect: Codemagic
        
    scripts:
      - name: 安装 CocoaPods 依赖
        script: |
          pod install
          # 修复 YYKit 对旧版 WebP.framework 的依赖，iOS 26 SDK 不兼容
          for f in Pods/Target\ Support\ Files/YYKit/YYKit.*.xcconfig; do
            sed -i '' 's/ -framework "WebP"//g' "$f"
            sed -i '' 's|"${PODS_ROOT}/YYKit/Vendor"||g' "$f"
          done
          # 为主 target 添加 -ld_classic 兼容旧版静态库 libbexbankcard.a
          ruby -e "
            file = 'PMPlatform_IOS.xcodeproj/project.pbxproj'
            content = File.read(file)
            content.gsub!(/OTHER_LDFLAGS = \(/) { 'OTHER_LDFLAGS = (\"-ld_classic\",' }
            content.gsub!(/OTHER_LDFLAGS = \"\"/) { 'OTHER_LDFLAGS = \"-ld_classic\"' }
            File.write(file, content)
          "
          echo "已添加 -ld_classic 到主 target"

      - name: 递增 Build Number
        script: |
          agvtool new-version -all $((BUILD_NUMBER + 1))
          echo "Build Number set to: $((BUILD_NUMBER + 1))"
          
      - name: 设置苹果自动签名
        script: |
          xcode-project use-profiles
          
      - name: 编译并打包生成 IPA
        script: |
          # 第一步：只做 Archive，不导出 IPA
          xcodebuild archive \
            -workspace "PMPlatform_IOS.xcworkspace" \
            -scheme "PMPlatform_IOS" \
            -configuration Release \
            -archivePath "build/ios/xcarchive/PMPlatform_IOS.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | xcpretty

          # 第二步：注入 PrivacyInfo.xcprivacy 到 xcarchive 内各 SDK framework
          # 在签名之前注入，避免破坏签名
          ARCHIVE_FW="build/ios/xcarchive/PMPlatform_IOS.xcarchive/Products/Applications/PMPlatform_IOS.app/Frameworks"
          echo "开始注入 PrivacyInfo.xcprivacy，Frameworks 目录: $ARCHIVE_FW"
          INJECTED=0
          for sdk in AFNetworking Alamofire Charts IQKeyboardManager Kingfisher SDWebImage SVProgressHUD SwiftyJSON; do
            FW="$ARCHIVE_FW/${sdk}.framework"
            if [ -d "$FW" ]; then
              if [ ! -f "$FW/PrivacyInfo.xcprivacy" ]; then
                cp "PrivacyManifests/${sdk}.xcprivacy" "$FW/PrivacyInfo.xcprivacy"
                echo "✅ 注入: ${sdk}.framework/PrivacyInfo.xcprivacy"
                INJECTED=$((INJECTED + 1))
              else
                echo "ℹ️  已存在: ${sdk}.framework/PrivacyInfo.xcprivacy"
              fi
            else
              echo "⚠️  未找到: ${sdk}.framework"
            fi
          done
          echo "共注入 $INJECTED 个 framework"

          # 第三步：从注入后的 xcarchive 导出 IPA（Codemagic 会处理签名）
          xcode-project build-ipa \
            --archive-path "build/ios/xcarchive/PMPlatform_IOS.xcarchive"

    artifacts:
      # 告诉 Codemagic 把生成的 ipa 安装包保存下来
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # 自动上传到苹果 App Store Connect 后台
      app_store_connect:
        auth: integration
        submit_to_testflight: false
