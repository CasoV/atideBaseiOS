workflows:
  ios-app-store-build:
    name: iOS App Store Build
    # 使用苹果 M2 芯片的电脑打包，速度极快
    instance_type: mac_mini_m2 
    environment:
      # 苹果要求 2026年4月28日起必须使用 Xcode 26 + iOS 26 SDK
      xcode: 26.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atide.constructionappBase
    
    # 【重要】自动签名，需要你在 Codemagic 后台绑定苹果 API Key
    integrations:
      app_store_connect: Codemagic
        
    scripts:
      - name: 安装 CocoaPods 依赖
        script: |
          pod install
          # 修复 YYKit 对旧版 WebP.framework 的依赖，iOS 26 SDK 不兼容
          for f in Pods/Target\ Support\ Files/YYKit/YYKit.*.xcconfig; do
            sed -i '' 's/ -framework "WebP"//g' "$f"
            sed -i '' 's|"${PODS_ROOT}/YYKit/Vendor"||g' "$f"
          done
          # 为主 target 添加 -ld_classic 兼容旧版静态库 libbexbankcard.a
          ruby -e "
            file = 'PMPlatform_IOS.xcodeproj/project.pbxproj'
            content = File.read(file)
            content.gsub!(/OTHER_LDFLAGS = \(/) { 'OTHER_LDFLAGS = (\"-ld_classic\",' }
            content.gsub!(/OTHER_LDFLAGS = \"\"/) { 'OTHER_LDFLAGS = \"-ld_classic\"' }
            File.write(file, content)
          "
          echo "已添加 -ld_classic 到主 target"
          # 修复 ITMS-91061：pod install 会重新生成 Pods.xcodeproj，需要在此之后重新注入
          # 将 PrivacyInfo.xcprivacy 加入各 SDK target 的 Copy Bundle Resources
          ruby -e "
            require 'xcodeproj'
            sdks = %w[AFNetworking Alamofire Charts IQKeyboardManager Kingfisher SDWebImage SVProgressHUD SwiftyJSON]
            project = Xcodeproj::Project.open('Pods/Pods.xcodeproj')
            sdks.each do |sdk|
              src = \"PrivacyManifests/#{sdk}.xcprivacy\"
              next unless File.exist?(src)
              target = project.targets.find { |t| t.name == sdk }
              unless target
                puts \"⚠️  未找到 target: #{sdk}\"
                next
              end
              dest_dir = \"Pods/#{sdk}\"
              next unless Dir.exist?(dest_dir)
              dest = \"#{dest_dir}/PrivacyInfo.xcprivacy\"
              FileUtils.cp(src, dest)
              group = project.main_group.recursive_children.find { |g|
                g.is_a?(Xcodeproj::Project::Object::PBXGroup) && g.display_name == sdk
              }
              unless group
                puts \"⚠️  未找到 group: #{sdk}\"
                next
              end
              file_ref = group.files.find { |f| f.path == 'PrivacyInfo.xcprivacy' }
              file_ref ||= group.new_file('PrivacyInfo.xcprivacy')
              already = target.resources_build_phase.files.any? { |f| f.file_ref == file_ref }
              target.resources_build_phase.add_file_reference(file_ref) unless already
              puts \"✅ #{sdk}: PrivacyInfo.xcprivacy 已加入 Copy Bundle Resources\"
            end
            project.save
          "

      - name: 递增 Build Number
        script: |
          agvtool new-version -all $BUILD_NUMBER
          echo "Build Number set to: $BUILD_NUMBER"
          
      - name: 设置苹果自动签名
        script: |
          xcode-project use-profiles
          
      - name: 编译并打包生成 IPA
        script: |
          xcode-project build-ipa \
            --workspace "PMPlatform_IOS.xcworkspace" \
            --scheme "PMPlatform_IOS"

    artifacts:
      # 告诉 Codemagic 把生成的 ipa 安装包保存下来
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # 自动上传到苹果 App Store Connect 后台
      app_store_connect:
        auth: integration
        submit_to_testflight: false
