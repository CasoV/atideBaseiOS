workflows:
  ios-app-store-build:
    name: iOS App Store Build
    # 使用苹果 M2 芯片的电脑打包，速度极快
    instance_type: mac_mini_m2 
    environment:
      # 苹果要求 2026年4月28日起必须使用 Xcode 26 + iOS 26 SDK
      xcode: 26.4
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.atide.constructionappBase
    
    # 【重要】自动签名，需要你在 Codemagic 后台绑定苹果 API Key
    integrations:
      app_store_connect: Codemagic
        
    scripts:
      - name: 安装 CocoaPods 依赖
        script: |
          pod install
          # 修复 YYKit 对旧版 WebP.framework 的依赖，iOS 26 SDK 不兼容
          for f in Pods/Target\ Support\ Files/YYKit/YYKit.*.xcconfig; do
            sed -i '' 's/ -framework "WebP"//g' "$f"
            sed -i '' 's|"${PODS_ROOT}/YYKit/Vendor"||g' "$f"
          done

      - name: 递增 Build Number
        script: |
          agvtool new-version -all $(($(agvtool what-version -terse) + 1))
          
      - name: 设置苹果自动签名
        script: |
          xcode-project use-profiles
          
      - name: 编译并打包生成 IPA
        script: |
          xcodebuild \
            -workspace "PMPlatform_IOS.xcworkspace" \
            -scheme "PMPlatform_IOS" \
            -configuration Release \
            -archivePath build/ios/xcarchive/PMPlatform_IOS.xcarchive \
            archive \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_LDFLAGS='$(inherited) -ld_classic'
          
          xcode-project build-ipa \
            --workspace "PMPlatform_IOS.xcworkspace" \
            --scheme "PMPlatform_IOS"

    artifacts:
      # 告诉 Codemagic 把生成的 ipa 安装包保存下来
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      # 自动上传到苹果 App Store Connect 后台
      app_store_connect:
        auth: integration
        submit_to_testflight: false